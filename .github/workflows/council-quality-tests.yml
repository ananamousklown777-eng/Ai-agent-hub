name: Council quality policy tests

on:
  push:
    branches: [main]
    paths:
      - "ai-council-sandbox/**"
      - ".github/workflows/council-quality-tests.yml"
  pull_request:
    paths:
      - "ai-council-sandbox/**"
      - ".github/workflows/council-quality-tests.yml"
  workflow_dispatch:

jobs:
  quality-policy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-council-sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
