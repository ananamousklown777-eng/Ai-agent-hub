name: Council quality policy tests

on:
  push:
    branches: [main]
    paths:
      - "ai-council-sandbox/**"
      - ".github/workflows/council-quality-tests.yml"
  pull_request:
    paths:
      - "ai-council-sandbox/**"
      - ".github/workflows/council-quality-tests.yml"
  workflow_dispatch:

jobs:
  quality-policy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-council-sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check backend JavaScript syntax
        run: node --check council-api.js
      - name: Run quality-policy regression tests
        run: npm test
      - name: Check the quality-test page JavaScript syntax
        working-directory: .
        run: |
          node -e "const fs=require('node:fs'); const html=fs.readFileSync('docs/council-quality-test.html','utf8'); const match=html.match(/<script>([\\s\\S]*?)<\\/script>/); if(!match) throw new Error('No inline script found'); fs.writeFileSync('/tmp/council-quality-test.js',match[1]);"
          node --check /tmp/council-quality-test.js
