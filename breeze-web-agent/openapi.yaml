openapi: 3.1.0
info:
  title: Big Shark Browser Inspection API
  version: 0.1.0
  description: >
    A self-hosted, open-source browser inspection endpoint. It inspects public
    webpages and returns page title, description, readable text, links, and
    a screenshot when the host can capture one. Prototype only.
servers:
  - url: https://breeze-web-agent.onrender.com
paths:
  /health:
    get:
      operationId: checkBigSharkHealth
      summary: Check whether Big Shark is running
      responses:
        "200":
          description: Service health and prototype status
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  service:
                    type: string
                  version:
                    type: string
                  feature:
                    type: string
                  productionReady:
                    type: boolean
  /api/inspect:
    post:
      operationId: inspectPublicWebpage
      summary: Inspect a public webpage
      description: >
        Only use for public pages. Never submit credentials, private account
        URLs, personal information, or URLs that trigger sensitive actions.
        Screenshot capture is best-effort and may fail on some sites or hosts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  format: uri
                  maxLength: 2048
                  description: Full public HTTP or HTTPS URL.
      responses:
        "200":
          description: Inspection result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  requestedUrl:
                    type: string
                  finalUrl:
                    type: string
                  inspectedAt:
                    type: string
                    format: date-time
                  title:
                    type: string
                  description:
                    type: string
                  text:
                    type: string
                  links:
                    type: array
                    items:
                      type: object
                      properties:
                        text:
                          type: string
                        url:
                          type: string
                  screenshotDataUrl:
                    type:
                      - string
                      - "null"
                    description: Base64 data URL when screenshot capture succeeds.
                  screenshotError:
                    type:
                      - string
                      - "null"
        "400":
          description: Invalid URL or blocked private/local address
        "429":
          description: Rate limit reached
        "502":
          description: Website inspection failed

  /api/workflow:
    post:
      operationId: runPublicPageResearchWorkflow
      summary: Research up to three public webpages in one run
      description: >
        Read-only browser workflow. Returns title, description, readable text,
        and useful links for each public page. Does not click buttons, submit
        forms, sign in, or execute user-provided code. Never use with private
        pages, credentials, personal data, or URLs that trigger sensitive actions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [urls]
              properties:
                urls:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items:
                    type: string
                    format: uri
                    maxLength: 2048
      responses:
        "200":
          description: Per-page research results; individual pages may fail independently
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  workflow:
                    type: string
                  completedAt:
                    type: string
                    format: date-time
                  pageCount:
                    type: integer
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        ok:
                          type: boolean
                        requestedUrl:
                          type: string
                        finalUrl:
                          type: string
                        title:
                          type: string
                        description:
                          type: string
                        text:
                          type: string
                        links:
                          type: array
                          items:
                            type: object
                            properties:
                              text:
                                type: string
                              url:
                                type: string
        "400":
          description: Invalid URL or blocked private/local address
        "429":
          description: Rate limit reached
        "502":
          description: Browser workflow failed to start
