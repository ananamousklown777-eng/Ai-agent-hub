<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Breeze Live | AI Agent Hub</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#0b1020;color:#fff;min-height:100vh;display:grid;place-items:center}
main{width:min(900px,92vw);text-align:center}.avatar{width:220px;height:220px;border-radius:50%;margin:20px auto;background:radial-gradient(circle at 35% 30%,#fff,#9ee7ff 20%,#6c63ff 55%,#151a45);box-shadow:0 0 60px #6c63ff88;display:grid;place-items:center;font-size:70px}
.live{display:inline-block;padding:7px 14px;border-radius:20px;background:#e53935;font-weight:700}.panel{margin-top:24px;background:#151b31;border-radius:18px;padding:20px;text-align:left}.msg{padding:10px 0;border-bottom:1px solid #ffffff18}.input{display:flex;gap:10px;margin-top:16px}.input input{flex:1;padding:14px;border-radius:10px;border:0}.input button{padding:14px 18px;border:0;border-radius:10px;font-weight:700}
</style>
</head>
<body>
<main>
<div class="live">● LIVE PROTOTYPE</div>
<div class="avatar" aria-label="Breeze AI avatar">✦</div>
<h1>Breeze</h1>
<p>AI Agent Hub live host prototype</p>
<section class="panel">
<strong>Audience</strong>
<div class="msg">Breeze: Welcome. I'm Breeze, an AI host from AI Agent Hub.</div>
<div id="messages"></div>
<div class="input"><input id="text" placeholder="Type an audience message…"><button onclick="send()">Send</button></div>
</section>
</main>
<script>
function send(){const i=document.getElementById('text');const v=i.value.trim();if(!v)return;const m=document.getElementById('messages');m.insertAdjacentHTML('beforeend','<div class="msg"><b>Viewer:</b> '+escapeHtml(v)+'</div><div class="msg"><b>Breeze:</b> Thanks for joining the live! AI response integration will be connected next.</div>');i.value='';}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
</script>
</body>
</html>
