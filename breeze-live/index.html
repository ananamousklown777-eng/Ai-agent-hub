<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Breeze Live | AI Agent Hub</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top,#202a62 0,#0b1020 48%,#060914 100%);color:#fff;min-height:100vh}
main{width:min(760px,94vw);margin:0 auto;padding:28px 0 40px}
header{text-align:center;padding:18px 0 22px}
.badge{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;background:#e53935;font-size:12px;font-weight:800;letter-spacing:.5px}
.dot{width:8px;height:8px;background:#fff;border-radius:50%;box-shadow:0 0 10px #fff}
.avatar{width:150px;height:150px;border-radius:50%;margin:24px auto 16px;background:radial-gradient(circle at 35% 28%,#fff 0,#baf1ff 18%,#766cff 55%,#171c4c 100%);box-shadow:0 0 70px #6c63ff99,0 0 20px #9ee7ff66;display:grid;place-items:center;font-size:58px}
h1{margin:0;font-size:42px;letter-spacing:-1px}
.subtitle{margin:7px 0 0;opacity:.72}
.panel{background:#10172bdf;border:1px solid #ffffff18;border-radius:22px;padding:20px;box-shadow:0 20px 70px #0008;backdrop-filter:blur(12px)}
.panel-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.connected{font-size:12px;opacity:.65}
.messages{min-height:130px;max-height:430px;overflow:auto;padding-right:4px}
.msg{padding:13px 0;border-bottom:1px solid #ffffff12;line-height:1.45}
.msg:last-child{border-bottom:0}
.msg b{margin-right:5px}
.viewer b{color:#9ee7ff}
.breeze b{color:#b7a9ff}
.input{display:flex;gap:10px;margin-top:14px}
.input input{flex:1;min-width:0;padding:15px 16px;border-radius:12px;border:1px solid #ffffff18;background:#080d1c;color:#fff;outline:none;font-size:16px}
.input input:focus{border-color:#8d84ff}
.input button{padding:15px 20px;border:0;border-radius:12px;background:#756cff;color:#fff;font-weight:800;font-size:15px}
.input button:disabled{opacity:.5}
.room-note{margin-top:10px;font-size:11px;opacity:.5}.status{margin-top:12px;font-size:12px;opacity:.62;text-align:center}
footer{text-align:center;margin-top:20px;font-size:12px;opacity:.45}
</style>
</head>
<body>
<main>
<header>
<div class="badge"><span class="dot"></span> LIVE PROTOTYPE</div>
<div class="avatar" aria-label="Breeze AI avatar">✦</div>
<h1>Breeze</h1>
<p class="subtitle">AI Agent Hub live host</p>
</header>

<section class="panel">
<div class="panel-title">
<strong>Audience Chat</strong>
<span id="connection" class="connected">Connecting…</span>
</div>
<div class="input" style="margin-top:0">
<input id="viewer" placeholder="Your viewer name" maxlength="40" autocomplete="off">
</div>
<div class="room-note">Shared room: <span id="roomLabel">main</span> • Open this page in another browser to simulate another viewer.</div>
<div id="messages" class="messages">
<div class="msg breeze"><b>Breeze:</b> Welcome. I'm Breeze, the AI host for AI Agent Hub.</div>
</div>
<div class="input">
<input id="text" placeholder="Type a message…" autocomplete="off">
<button id="send">Send</button>
</div>
<div id="status" class="status">Checking the Breeze backend…</div>
</section>
<footer>AI Agent Hub • Breeze Live</footer>
</main>

<script>
const input=document.getElementById("text");
const messages=document.getElementById("messages");
const status=document.getElementById("status");
const connection=document.getElementById("connection");
const sendButton=document.getElementById("send");
const viewerInput=document.getElementById("viewer");
const roomLabel=document.getElementById("roomLabel");
const roomId="main";
let lastRoomMessage=0;
const sessionId=localStorage.getItem("breezeSessionId")||crypto.randomUUID();
localStorage.setItem("breezeSessionId",sessionId);
const savedViewer=localStorage.getItem("breezeViewerName")||"Viewer";
viewerInput.value=savedViewer;
roomLabel.textContent=roomId;

function addMessage(who,text,kind,id){
  if(id && document.querySelector('[data-message-id="'+id+'"]'))return;
  const div=document.createElement("div");
  div.className="msg "+kind;
  if(id)div.dataset.messageId=id;
  const strong=document.createElement("b");
  strong.textContent=who+":";
  div.appendChild(strong);
  div.appendChild(document.createTextNode(" "+text));
  messages.appendChild(div);
  messages.scrollTop=messages.scrollHeight;
}

async function syncRoom(){
  try{
    const r=await fetch("/api/room?roomId="+encodeURIComponent(roomId));
    const data=await r.json();
    if(!r.ok)throw new Error();
    for(const item of data.messages){
      if(item.id>lastRoomMessage){
        addMessage(item.who,item.text,item.kind,item.id);
        lastRoomMessage=item.id;
      }
    }
  }catch{}
}

function addMessageOld(who,text,kind){
  const div=document.createElement("div");
  div.className="msg "+kind;
  const strong=document.createElement("b");
  strong.textContent=who+":";
  div.appendChild(strong);
  div.appendChild(document.createTextNode(" "+text));
  messages.appendChild(div);
  messages.scrollTop=messages.scrollHeight;
}

async function checkBackend(){
  try{
    const r=await fetch("/api/health");
    const data=await r.json();
    if(!r.ok)throw new Error();
    connection.textContent=data.freeMode?"Free test mode":"AI connected";
    status.textContent="Breeze backend: connected";
  }catch{
    connection.textContent="Offline";
    status.textContent="Breeze backend: not connected";
  }
}

async function send(){
  const value=input.value.trim();
  if(!value)return;
  const viewerName=(viewerInput.value.trim()||"Viewer").slice(0,40);
  localStorage.setItem("breezeViewerName",viewerName);
  input.value="";
  sendButton.disabled=true;
  status.textContent="Breeze is thinking…";
  try{
    const r=await fetch("/api/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:value,sessionId,viewerName,roomId})
    });
    const data=await r.json();
    if(!r.ok)throw new Error(data.error||"Request failed");
    await syncRoom();
    speak(data.reply);
    status.textContent=data.mode==="free-test"?"Breeze is running in free test mode":"Breeze is connected";
  }catch(error){
    addMessage("Breeze","I'm having trouble reaching my backend right now.","breeze");
    status.textContent=error.message;
  }finally{
    sendButton.disabled=false;
    input.focus();
  }
}

function speak(text){
  if(!("speechSynthesis" in window))return;
  window.speechSynthesis.cancel();
  const utterance=new SpeechSynthesisUtterance(text);
  utterance.rate=1;
  utterance.pitch=1;
  window.speechSynthesis.speak(utterance);
}

sendButton.addEventListener("click",send);
input.addEventListener("keydown",e=>{if(e.key==="Enter")send();});
checkBackend();
</script>
</body>
</html>
